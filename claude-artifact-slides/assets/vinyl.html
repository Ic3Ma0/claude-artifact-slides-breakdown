<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>声音，刻在哪里？</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5efdc;color:#202321;font:16px "Helvetica Neue","PingFang SC",sans-serif}main{min-height:100svh;display:grid;grid-template-columns:40% 60%;grid-template-rows:1fr auto}.copy{z-index:1;padding:clamp(24px,5vw,84px);padding-right:0;align-self:center}.kicker{font:600 14px ui-monospace,monospace;letter-spacing:.12em;color:#93401f}h1{font-size:clamp(42px,5.9vw,100px);line-height:1.04;letter-spacing:-.065em;margin:.42em 0 .32em;text-wrap:balance}p{font-size:clamp(17px,1.55vw,26px);line-height:1.65;max-width:22em}.stage{width:100%;height:100%;min-height:50svh;display:block}label{display:inline-grid;gap:6px;font-size:14px;margin-top:1em}input{accent-color:#b44123}footer{grid-column:1/-1;border-top:1px solid #20232155;display:flex;align-items:center;gap:9px;padding:12px 4vw;flex-wrap:wrap}button{border:1px solid #534f43;border-radius:20px;background:transparent;padding:7px 14px;color:inherit;cursor:pointer}button:disabled{opacity:.35}output{font:14px ui-monospace,monospace;margin-right:auto}aside{font-size:15px;line-height:1.6;background:#fff8e7;padding:12px 4vw;grid-column:1/-1}[hidden]{display:none!important}@media(max-width:720px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}.copy{padding:24px 7vw 0}.stage{min-height:220px;height:44svh}h1{font-size:44px}p{margin:.4em 0}footer{gap:6px}button{padding:6px 10px}}
</style><main><section class="copy" aria-live="polite"><div class="kicker"></div><h1></h1><p></p><label hidden>播放转速 <span id="rpm"></span><input type="range" min="26" max="45" value="33" aria-label="播放转速"></label></section><canvas class="stage" role="img"></canvas><aside hidden></aside><footer><output></output><button id="prev" aria-label="上一步">←</button><button id="next" aria-label="下一步">→</button><button id="auto">自动播放</button><button id="notes">讲者备注</button></footer></main>
<script>
const beats=[
 ['唱片','声音，刻在哪里？','这张唱片没有通电。音乐藏在什么地方？','提起一张唱片，停一下，让听众先猜。','disc'],
 ['唱针','落针。','唱针贴着旋转的沟槽前进。我们把针尖下方放大。','沿铜色唱臂找到针尖。实际沟槽是一条盘绕的螺旋，图中环线作简化。','needle'],
 ['沟槽','一段弯路。','沟槽的细微起伏推着针尖振动。','以单声道侧向刻纹为例。图中横向位移经过放大。','groove'],
 ['转速实验','同一段路，快一点。','拖动转速，观察同一段纹路经过针尖的速度。','请一位听众拖动滑块。更快经过相同数量的起伏，每秒振动次数更多，音高也更高。此处用视觉模拟。','speed'],
 ['拾音','声音，从这里回来。','沟槽带动唱针，唱头把振动变成电信号。','回到开场的问题。唱片保存沟槽的形状；扬声器最终把放大后的信号变成空气振动。','return']
];
const $=s=>document.querySelector(s),canvas=$('canvas'),ctx=canvas.getContext('2d');
const range=$('input'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
let index=0,timer=null,phase=0,last=0,entered=0;
function show(n){
 index=Math.max(0,Math.min(beats.length-1,n));entered=performance.now();
 const [section,title,line,note,scene]=beats[index];
 $('.kicker').textContent=section;$('h1').textContent=title;$('p').textContent=line;$('aside').textContent=note;
 $('output').textContent=(index+1)+' / '+beats.length;
 $('label').hidden=scene!=='speed';canvas.setAttribute('aria-label',section+'示意图。'+line);
 $('#prev').disabled=index===0;$('#next').disabled=index===beats.length-1;
 if(index===beats.length-1) stop();paint(entered);
}
function stop(){clearInterval(timer);timer=null;$('#auto').textContent='自动播放'}
function toggleAuto(){if(timer){stop();return}if(index===beats.length-1)show(0);timer=setInterval(()=>show(index+1),6500);$('#auto').textContent='暂停播放'}
function step(d){stop();show(index+d)}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#auto').onclick=toggleAuto;
$('#notes').onclick=()=>{$('aside').hidden=!$('aside').hidden;$('#notes').setAttribute('aria-expanded',String(!$('aside').hidden))};
onkeydown=e=>{if(e.target===range||e.ctrlKey||e.metaKey||e.altKey)return;
 if(['ArrowRight','ArrowLeft',' '].includes(e.key)){if(e.key===' '&&e.target.tagName==='BUTTON')return;e.preventDefault();step(e.key==='ArrowLeft'?-1:1)}
 if(e.key.toLowerCase()==='n')$('#notes').click();if(e.key.toLowerCase()==='a')toggleAuto()};
function speed(){ $('#rpm').textContent=range.value+' RPM';paint(performance.now()) }
range.oninput=speed;
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill()}
function line(points,color,width){ctx.beginPath();for(const [i,p] of points.entries())i?ctx.lineTo(...p):ctx.moveTo(...p);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function disc(mode){
 ctx.save();ctx.translate(355,248);ctx.scale(1,.92);circle(0,0,218,'#181b1b');
 for(let r=68;r<=216;r+=2.25){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle=r%9<3?'#606464':'#303534';ctx.lineWidth=.85;ctx.stroke()}
 const light=ctx.createConicGradient(.4,0,0);
 for(const [p,c] of [[0,'#0000'],[.09,'#ebeee339'],[.17,'#0000'],[.52,'#0000'],[.61,'#ebeee345'],[.71,'#0000'],[1,'#0000']])light.addColorStop(p,c);
 circle(0,0,217,light);ctx.rotate(phase*.18);circle(0,0,63,'#cb4a2c');circle(0,0,4,'#ede4cc');line([[-43,16],[-14,16]],'#efc7a5',4);ctx.restore();
 if(mode==='needle'||mode==='return'){line([[605,42],[585,105],[478,289]],'#2c302d',13);line([[605,40],[582,102],[476,285]],'#bea17a',5);circle(605,42,15,'#4b504c');circle(478,290,4,'#da532b')}
}
function wave(x){return 22*Math.sin(x*.038)+8*Math.sin(x*.096+.7)+4*Math.cos(x*.16)}
function groove(){
 const offset=phase*29;
 for(let j=-4;j<=4;j++){const pts=[];for(let x=22;x<630;x+=2)pts.push([x,242+j*49+wave(x+offset)]);
 line(pts,j===0?'#b43d23':'#bfb8a4',j===0?4:1.3)}
 const y=242+wave(334+offset);line([[485,8],[352,y-36],[334,y]],'#262d2b',10);circle(334,y,8,'#cf4829');
}
function paint(now){
 const rect=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(rect.width*d),h=Math.round(rect.height*d);
 if(!w||!h)return;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);const scale=Math.min(w/660,h/500);ctx.translate((w-scale*660)/2,(h-scale*500)/2);ctx.scale(scale,scale);
 const scene=beats[index][4],p=reduce.matches?1:Math.min(1,(now-entered)/680);
 ctx.save();ctx.globalAlpha=.22+.78*p;ctx.translate((1-p)*15,0);
 if(scene==='groove'||scene==='speed')groove();else disc(scene);ctx.restore();
}
function tick(now){if(!reduce.matches){phase+=Math.min((now-last)/1000,.06)*Number(range.value)/33;paint(now)}last=now;requestAnimationFrame(tick)}
new ResizeObserver(()=>paint(performance.now())).observe(canvas);speed();show(0);requestAnimationFrame(tick);
</script></html>
